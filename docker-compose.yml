version: '3.8'

services:
  db:
    image: mysql:8.2
    container_name: devhub-mysql
    environment:
      MYSQL_DATABASE: devhub_db
      MYSQL_USER: devhub_user
      MYSQL_PASSWORD: devhub_pass
      MYSQL_ROOT_PASSWORD: root_secure_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: devhub-app
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: devhub_db
      DB_USER: devhub_user
      DB_PASSWORD: devhub_pass
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
