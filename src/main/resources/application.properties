# ============================================================
#  DevHub - Application Configuration
#  Spring Boot 3.2.4 | Java 21 | MySQL 8.x
# ============================================================

# ─── Server ───────────────────────────────────────────────
server.port=8080
spring.application.name=DevHub

# ─── DataSource (MySQL) ───────────────────────────────────
# Docker Compose environment variables se inject hoga;
# local development ke liye niche default values hain.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:devhub_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:devhub_user}
spring.datasource.password=${DB_PASSWORD:devhub_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── Connection Pool (HikariCP) ───────────────────────────
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000

# ─── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ─── Thymeleaf ────────────────────────────────────────────
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ─── Spring Security ──────────────────────────────────────
# BCryptPasswordEncoder strength (default 10, tune as needed)
spring.security.bcrypt.strength=10

# ─── Multipart (file uploads) ─────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ─── Pagination Defaults (AppConstants ke sath aligned) ───
app.pagination.default-page-size=10
app.pagination.max-page-size=50

# ─── Logging ──────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.devhub=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ─── SpringDoc / Swagger UI ───────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=alpha

# ─── Actuator (optional - monitoring ke liye) ─────────────
# management.endpoints.web.exposure.include=health,info
# management.endpoint.health.show-details=always