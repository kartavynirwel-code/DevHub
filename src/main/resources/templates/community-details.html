<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{layout/base :: html_head('Community')}"></head>

<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container my-4">

    <div class="row">

        <!-- Community Info -->
        <div class="col-md-8">

            <!-- Header -->
            <div class="card shadow-sm mb-4 border-0">
                <div class="card-body bg-primary text-white">
                    <h1 th:text="'d/' + ${community.name}" class="mb-2">
                        Community Name
                    </h1>
                    <p class="mb-0" th:text="${community.description}">
                        Community description
                    </p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="mb-4">
                <sec:authorize access="isAuthenticated()">
                    <a th:href="@{/posts/create}" class="btn btn-primary">
                        ✏️ Create Post
                    </a>
                    <button class="btn btn-outline-primary">
                        ⭐ Join Community
                    </button>
                </sec:authorize>

                <sec:authorize access="isAnonymous()">
                    <a th:href="@{/login}" class="btn btn-primary">
                        Log in to Post
                    </a>
                </sec:authorize>
            </div>

            <!-- Community Stats -->
            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <h3 class="card-title">0</h3>
                            <p class="card-text text-muted">Posts</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <h3 class="card-title" th:text="${community.members.size()}">0</h3>
                            <p class="card-text text-muted">Members</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card text-center">
                        <div class="card-body">
                            <h3 class="card-title">0</h3>
                            <p class="card-text text-muted">Comments</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Posts in Community -->
            <h5 class="mb-3">Latest Posts</h5>

            <div class="alert alert-info">
                Posts from this community will appear here.
            </div>

        </div>

        <!-- Sidebar -->
        <div class="col-md-4">

            <!-- Community Info Card -->
            <div class="card shadow-sm mb-3">
                <div class="card-header bg-light">
                    <h6 class="mb-0">📋 About</h6>
                </div>
                <div class="card-body">
                    <p class="text-muted small" th:text="${community.description}">
                        Description
                    </p>
                    <hr>
                    <small class="text-muted d-block">
                        <strong>Created:</strong><br>
                        <span th:text="${#temporals.format(community.createdAt, 'MMM dd, yyyy')}">
                            Date
                        </span>
                    </small>
                    <small class="text-muted d-block mt-2">
                        <strong>Creator:</strong><br>
                        <span th:text="${community.createdBy.username}">
                            Creator
                        </span>
                    </small>
                </div>
            </div>

            <!-- Members Card -->
            <div class="card shadow-sm">
                <div class="card-header bg-light">
                    <h6 class="mb-0">👥 Members (<span th:text="${community.members.size()}">0</span>)</h6>
                </div>
                <ul class="list-group list-group-flush">
                    <li th:each="member : ${community.members.stream().limit(5).toList()}" class="list-group-item">
                        <a th:href="@{/profile/{username}(username=${member.username})}"
                           th:text="'u/' + ${member.username}"
                           class="text-decoration-none">
                            Member
                        </a>
                    </li>
                    <li th:if="${community.members.size() > 5}" class="list-group-item text-muted small">
                        <span th:text="'+ ' + ${community.members.size() - 5} + ' more members'">
                            More members
                        </span>
                    </li>
                </ul>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
