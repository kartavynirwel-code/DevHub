<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: html_head('Create Community')}"></head>

<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">

    <div class="card shadow" style="max-width: 600px; margin: 0 auto;">

        <div class="card-header bg-success text-white">
            <h3 class="mb-0">Create New Community</h3>
        </div>

        <div class="card-body">

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error!</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Success Info -->
            <div class="alert alert-info mb-4">
                <strong>Create a space</strong> for discussions around your favorite topics!
            </div>

            <!-- Form -->
            <form th:action="@{/communities/create}"
                  th:object="${communityCreateDto}"
                  method="post"
                  novalidate>

                <!-- Community Name Field -->
                <div class="mb-3">
                    <label for="name" class="form-label">Community Name <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text">d/</span>
                        <input type="text"
                               id="name"
                               th:field="*{name}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                               placeholder="e.g., java, springboot, devops"
                               maxlength="50"
                               required>
                    </div>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('name')}">
                        <span th:errors="*{name}"></span>
                    </div>
                    <small class="form-text text-muted">2-50 characters. No spaces or special characters.</small>
                </div>

                <!-- Description Field -->
                <div class="mb-3">
                    <label for="description" class="form-label">Description <span class="text-danger">*</span></label>
                    <textarea id="description"
                              th:field="*{description}"
                              rows="5"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                              placeholder="Describe what this community is about..."
                              maxlength="500"
                              required></textarea>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('description')}">
                        <span th:errors="*{description}"></span>
                    </div>
                    <small class="form-text text-muted">10-500 characters</small>
                </div>

                <!-- Form Actions -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-success btn-lg flex-grow-1">
                        <i class="bi bi-plus-circle"></i> Create Community
                    </button>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
