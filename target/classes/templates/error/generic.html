<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: html_head('Error')}"></head>

<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="alert alert-danger" role="alert">
                <h4 class="alert-heading">
                    <i class="bi bi-exclamation-triangle"></i> Oops! Something went wrong
                </h4>
                <hr>
                <p th:text="${message ?: 'An unexpected error occurred. Please try again later.'}">
                    Error message goes here.
                </p>
            </div>

            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <a th:href="@{/}" class="btn btn-primary btn-lg">
                        Back to Home
                    </a>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
