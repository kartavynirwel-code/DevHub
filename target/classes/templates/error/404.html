<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: html_head('Page Not Found')}"></head>

<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container my-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="text-center mb-4">
                <h1 style="font-size: 5rem; color: #dc3545;">404</h1>
                <h2>Page Not Found</h2>
            </div>

            <div class="alert alert-warning" role="alert">
                <p th:text="${message ?: 'The resource you are looking for does not exist.'}">
                    Error message goes here.
                </p>
            </div>

            <div class="card shadow-sm">
                <div class="card-body text-center">
                    <a th:href="@{/}" class="btn btn-primary btn-lg">
                        Back to Home
                    </a>
                </div>
            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
