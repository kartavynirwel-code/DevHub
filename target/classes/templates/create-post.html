<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/base :: html_head('Create Post')}"></head>

<body>

<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Create New Post</h3>
        </div>

        <div class="card-body">

            <!-- Error Alert -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>Error!</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <!-- Form -->
            <form th:action="@{/posts/create}"
                  th:object="${postCreateDto}"
                  method="post"
                  novalidate>

                <!-- Title Field -->
                <div class="mb-3">
                    <label for="title" class="form-label">Title <span class="text-danger">*</span></label>
                    <input type="text"
                           id="title"
                           th:field="*{title}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'"
                           placeholder="Enter post title"
                           required>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('title')}">
                        <span th:errors="*{title}"></span>
                    </div>
                </div>

                <!-- Community Field -->
                <div class="mb-3">
                    <label for="communityId" class="form-label">Community <span class="text-danger">*</span></label>
                    <select id="communityId"
                            th:field="*{communityId}"
                            class="form-select"
                            th:classappend="${#fields.hasErrors('communityId')} ? 'is-invalid'"
                            required>

                        <option value="" selected>
                            -- Select a Community --
                        </option>

                        <option th:each="community : ${communities}"
                                th:value="${community.id}"
                                th:text="${community.name}">
                        </option>

                    </select>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('communityId')}">
                        <span th:errors="*{communityId}"></span>
                    </div>
                </div>

                <!-- Content Field -->
                <div class="mb-3">
                    <label for="content" class="form-label">Content <span class="text-danger">*</span></label>
                    <textarea id="content"
                              th:field="*{content}"
                              rows="8"
                              class="form-control"
                              th:classappend="${#fields.hasErrors('content')} ? 'is-invalid'"
                              placeholder="Write your post content here..."
                              required></textarea>
                    <div class="invalid-feedback" th:if="${#fields.hasErrors('content')}">
                        <span th:errors="*{content}"></span>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary btn-lg">
                        <i class="bi bi-check-circle"></i> Create Post
                    </button>
                    <a th:href="@{/}" class="btn btn-outline-secondary btn-lg">
                        Cancel
                    </a>
                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
