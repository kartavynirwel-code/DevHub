# ============================================================
#  DevHub - Kubernetes Secret
#  Sensitive values base64 encoded hain
#  Command: kubectl apply -f secret.yaml
# ============================================================
#
#  NOTE: Values khud encode karo apne passwords se:
#  echo -n "your_password" | base64
#
#  Niche DEFAULT values hain (local/dev ke liye)
#  Production mein strong passwords use karna!
#
#  devhub_user     → ZGV2aHViX3VzZXI=
#  devhub_pass     → ZGV2aHViX3Bhc3M=
#  root_secure_password → cm9vdF9zZWN1cmVfcGFzc3dvcmQ=
#  devhub_db       → ZGV2aHViX2Ri
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: devhub-secrets
  namespace: default
type: Opaque
data:
  DB_USER: cm9vdA==
  DB_PASSWORD: cm9vdA==
  MYSQL_ROOT_PASSWORD: cm9vdF9zZWN1cmVfcGFzc3dvcmQ=
  DB_NAME: ZGV2aHViX2Ri